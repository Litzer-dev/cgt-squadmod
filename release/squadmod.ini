[SquadMod]
; 1 = squad slots without a human player get an AI soldier in multiplayer
Enabled=1
; how many squad members should exist in total (1-4)
FillCount=4
; 1 = AI squadmates are simulated by the host and mirrored to clients (recommended)
; 0 = vanilla debug behaviour (owned by an empty slot -> they will probably freeze)
HostOwnsAI=1
; write squadmod_1.log / squadmod_2.log
Log=1
; 1 = for testing two game copies on ONE PC over LAN (instance 1 = 127.0.0.1, instance 2 = 127.0.0.2)
; set to 0 when playing on real separate PCs
LoopbackTest=0
; 1 = do not lock the mouse to the game window (DirectInput non-exclusive). Also needed for the display
;     handling (windowed / borderless, saved resolution) and the STEAM / GRAPHICS menus.
FreeMouse=1
; 1 = extra diagnostic logging (order handler, network messages, and why the game closed if it ever exits by itself)
Debug=0
; 1 = play over Steam: your friends-only Steam lobby acts as a LAN. Friends join you through Steam,
;     then everyone uses MULTIPLAYER > STEAM CO-OP (the game's LAN screen). Needs steam_api.dll next to
;     the game and Steam running.
Steam=1
; 1 = other players see your Steam name, 0 = your game profile name (also set in OPTIONS > STEAM)
SteamName=1
; developer testing only: with LoopbackTest=1, send the two copies' traffic through the Steam-style tunnel
TunnelTest=0
